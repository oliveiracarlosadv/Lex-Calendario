]}],[\"$\",\"p\",null,{\"children\":\"A proposta é simples: reunir em um só lugar audiências, prazos, clientes e processos, com a clareza visual de um calendário moderno e a precisão que a advocacia exige. O app consulta o Diário de Justiça Eletrônico Nacional pela OAB do advogado, cadastra os processos intimados, conta os prazos em dias úteis segundo o CPC e transforma cada publicação em um compromisso com lembretes no computador e no Google Agenda.\"}],[\"$\",\"p\",null,{\"children\":\"Depois de anos como sócio de escritório, coordenando equipe, planejamento e atendimento, Carlos percebeu que boa parte do estresse da profissão vem do controle manual de agendas espalhadas. Ao fundar sua própria assessoria e consultoria jurídica, decidiu construir a ferramenta que gostaria de ter usado desde o primeiro dia de OAB: gratuita, que funciona offline e guarda os dados no computador do próprio advogado, respeitando o sigilo profissional e a LGPD.\"}],[\"$\",\"p\",null,{\"children\":\"O ramo de oliveira que assina o aplicativo vem da identidade visual do escritório do criador — símbolo de paz e de justiça — e resume o espírito do projeto: tecnologia a serviço de uma advocacia mais serena.\"}],[\"$\",\"div\",null,{\"className\":\"flex flex-wrap gap-4 pt-1 text-sm\",\"children\":[[\"$\",\"a\",null,{\"href\":\"https://lattes.cnpq.br/4151018791454248\",\"target\":\"_blank\",\"rel\":\"noreferrer\",\"className\":\"flex items-center gap-1.5 text-primary hover:underline\",\"children\":[[\"$\",\"svg\",null,{\"ref\":\"$undefined\",\"xmlns\":\"http://www.w3.org/2000/svg\",\"width\":24,\"height\":24,\"viewBox\":\"0 0 24 24\",\"fill\":\"none\",\"stroke\":\"currentColor\",\"strokeWidth\":2,\"strokeLinecap\":\"round\",\"strokeLinejoin\":\"round\",\"className\":\"lucide lucide-external-link size-4\",\"aria-hidden\":\"true\",\"children\":[[\"$\",\"path\",\"1q9fwt\",{\"d\":\"M15 3h6v6\"}],[\"$\",\"path\",\"gplh6r\",{\"d\":\"M10 14 21 3\"}],[\"$\",\"path\",\"a6xqqp\",{\"d\":\"M18 13v6a2 2 0 0
